name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check code formatting and linting (Server)
      run: npm run lint -w @cloudpulse/server

    - name: Run TypeScript typecheck (Server)
      run: npm run typecheck -w @cloudpulse/server
      continue-on-error: true # Temporarily allow errors due to pre-existing type issues

    - name: Run unit tests (Server)
      run: npm run test -w @cloudpulse/server
